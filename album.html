<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align:center;
            font-family:Arial,sans-serif;
            margin-top:50px;
        }
        img{
            width:300px;
            height:500px;
            border-radius:10px;
            margin:20px
        }
        button{
            padding:10px 10px;
            font-size:16px;
            margin:5px;
            cursor:pointer;
        }
    </style>
</head>
<body>

     <h2 style="color:rgb(183, 85, 85)">Image Changer</h2>
    <img id="image" alt="id"><br>
    <button onclick="prevImage()">previous</button>
    <button onclick="nextImage()">next</button>
    <script>
        const images=[
           
            "spiderman2.jpg",
            "cars.jpg"
    ];
        let currentIndex=0;
        window.onload=function(){
            document.getElementById("image").src=images[currentIndex];

        };

        function nextImage(){
            currentIndex=(currentIndex+1)% images.length;
            document.getElementById("image").src=images[currentIndex];

        }
        function prevImage(){
            currentIndex=(currentIndex-1+images.length)%images.lenght;
            document.getElementById("image").src=images[currentIndex];
        }
    </script>
    
   
  
  
    
</body>
</html>
